<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Google Sheets - No Blink Ultimate</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }
        
        #dashboard-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            overflow: hidden;
        }
        
        /* Layer utama yang selalu terlihat */
        #display-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: #ffffff;
            overflow: hidden;
        }
        
        /* Layer background untuk preloading */
        #preload-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #ffffff;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
        
        /* Iframe di dalam layer */
        .layer-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
            display: block;
        }
        
        /* Teknik snapshot: kita akan menggunakan canvas untuk screenshot */
        #snapshot-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            background: #ffffff;
        }
        
        #snapshot-canvas.active {
            opacity: 1;
        }
        
        /* Loading overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.8s ease;
        }
        
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loader-text {
            margin-top: 20px;
            color: #666;
            font-size: 16px;
            font-weight: 500;
        }
        
        /* Status bar kecil (opsional) */
        #status-bar {
            position: fixed;
            bottom: 10px;
            right: 15px;
            z-index: 10000;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loader"></div>
        <div class="loader-text">Memuat Dashboard...</div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">⏳ Memuat...</div>

    <!-- Dashboard Container -->
    <div id="dashboard-container">
        <!-- Display Layer - Selalu terlihat -->
        <div id="display-layer">
            <iframe id="display-frame" class="layer-iframe" src="about:blank"></iframe>
        </div>
        
        <!-- Preload Layer - Untuk memuat konten baru -->
        <div id="preload-layer">
            <iframe id="preload-frame" class="layer-iframe" src="about:blank"></iframe>
        </div>
        
        <!-- Canvas untuk snapshot (screenshot) -->
        <canvas id="snapshot-canvas"></canvas>
    </div>

    <script>
        (function() {
            'use strict';
            
            const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrR_4sYU9WDCp382UliBFElOjQ_lvMkvZQl9tkzRmrNmdYT3ZDSRPoXV3Qm8d12eZ46prmGhVFuym4/pubhtml?gid=1962305559&single=true";
            
            // DOM Elements
            const displayFrame = document.getElementById('display-frame');
            const preloadFrame = document.getElementById('preload-frame');
            const displayLayer = document.getElementById('display-layer');
            const preloadLayer = document.getElementById('preload-layer');
            const canvas = document.getElementById('snapshot-canvas');
            const ctx = canvas.getContext('2d');
            const statusBar = document.getElementById('status-bar');
            const loadingOverlay = document.getElementById('loading-overlay');
            
            // State
            let isUpdating = false;
            let isFirstLoad = true;
            let refreshInterval = null;
            let snapshotActive = false;
            
            // Resize canvas
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            
            // Ambil screenshot dari iframe
            function captureSnapshot(frame) {
                try {
                    // Coba ambil screenshot menggunakan canvas
                    // Catatan: Ini hanya bisa dilakukan jika iframe是同源
                    // Untuk Google Sheets yang cross-origin, kita gunakan pendekatan lain
                    
                    // Method alternatif: clone konten ke canvas
                    // Tapi karena cross-origin, kita tidak bisa akses kontennya
                    // Jadi kita gunakan teknik CSS opacity saja
                    
                    // Kita hanya akan menggunakan opacity transition
                    return false;
                } catch(e) {
                    return false;
                }
            }
            
            // Teknik swap dengan opacity
            function performSwap() {
                // Sembunyikan snapshot
                canvas.classList.remove('active');
                snapshotActive = false;
                
                // Pindahkan preload layer ke display
                // Kita pindahkan DOM element-nya
                const preloadContent = preloadLayer.innerHTML;
                const displayContent = displayLayer.innerHTML;
                
                // Swap konten
                displayLayer.innerHTML = preloadContent;
                preloadLayer.innerHTML = displayContent;
                
                // Re-assign frame references
                const newDisplayFrame = displayLayer.querySelector('iframe');
                const newPreloadFrame = preloadLayer.querySelector('iframe');
                
                // Update references
                if (newDisplayFrame) {
                    displayFrame.src = newDisplayFrame.src;
                }
                if (newPreloadFrame) {
                    preloadFrame.src = newPreloadFrame.src;
                }
                
                // Update status
                isUpdating = false;
                statusBar.textContent = '✅ Diperbarui: ' + new Date().toLocaleTimeString();
                
                // Sembunyikan loading overlay jika first load
                if (isFirstLoad) {
                    isFirstLoad = false;
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                    }, 500);
                }
            }
            
            // Load konten baru di preload layer
            function loadNextContent() {
                if (isUpdating) {
                    console.log('Update in progress, skipping...');
                    return;
                }
                
                isUpdating = true;
                statusBar.textContent = '⏳ Memuat ulang...';
                
                // Generate URL dengan timestamp
                const url = SHEET_URL + '&t=' + new Date().getTime();
                
                // Set ke preload frame
                preloadFrame.src = url;
                
                // Handler untuk load selesai
                const loadHandler = function() {
                    preloadFrame.removeEventListener('load', loadHandler);
                    preloadFrame.removeEventListener('error', errorHandler);
                    
                    // Tunggu sebentar agar konten benar-benar tampil
                    setTimeout(() => {
                        // Aktifkan snapshot dulu (sebagai cover)
                        takeSnapshot();
                        
                        // Lakukan swap
                        setTimeout(() => {
                            performSwap();
                        }, 100);
                    }, 500); // Tunggu 500ms agar konten stabil
                };
                
                // Error handler
                const errorHandler = function() {
                    preloadFrame.removeEventListener('load', loadHandler);
                    preloadFrame.removeEventListener('error', errorHandler);
                    
                    console.error('Failed to load content');
                    isUpdating = false;
                    statusBar.textContent = '❌ Gagal memuat';
                    
                    // Retry setelah 3 detik
                    setTimeout(() => {
                        if (!isUpdating) {
                            loadNextContent();
                        }
                    }, 3000);
                };
                
                preloadFrame.addEventListener('load', loadHandler);
                preloadFrame.addEventListener('error', errorHandler);
                
                // Timeout safety
                setTimeout(() => {
                    if (isUpdating) {
                        console.warn('Load timeout, forcing swap');
                        preloadFrame.removeEventListener('load', loadHandler);
                        preloadFrame.removeEventListener('error', errorHandler);
                        
                        // Force swap
                        takeSnapshot();
                        setTimeout(() => {
                            performSwap();
                        }, 100);
                    }
                }, 20000); // 20 detik timeout
            }
            
            // Ambil snapshot dari display saat ini
            function takeSnapshot() {
                try {
                    // Karena cross-origin, kita tidak bisa capture langsung
                    // Gunakan CSS trick: clone display layer ke canvas
                    // Tapi kita hanya bisa menampilkan layer yang sudah ada
                    
                    // Kita akan gunakan canvas sebagai overlay dengan opacity
                    // Isi dengan warna putih dulu
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Coba capture display layer
                    // Karena cross-origin, kita hanya bisa menampilkan layar saat ini
                    // dengan cara men-snapshot seluruh viewport
                    
                    // Gunakan html2canvas atau sejenisnya? Tidak bisa di sini.
                    // Kita akan gunakan pendekatan sederhana: 
                    // tampilkan canvas dengan opacity rendah sebagai transisi
                    
                    canvas.classList.add('active');
                    snapshotActive = true;
                    
                    // Hilangkan setelah 500ms
                    setTimeout(() => {
                        canvas.classList.remove('active');
                        snapshotActive = false;
                    }, 500);
                    
                } catch(e) {
                    console.log('Snapshot not available');
                }
            }
            
            // Inisialisasi
            function initialize() {
                console.log('Initializing dashboard...');
                
                // Load pertama ke display frame
                const url = SHEET_URL + '&t=' + new Date().getTime();
                displayFrame.src = url;
                
                // Tunggu display frame selesai
                displayFrame.addEventListener('load', function onFirstLoad() {
                    displayFrame.removeEventListener('load', onFirstLoad);
                    console.log('First load complete');
                    
                    // Sembunyikan loading overlay
                    isFirstLoad = false;
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                    }, 500);
                    
                    statusBar.textContent = '✅ Siap: ' + new Date().toLocaleTimeString();
                    
                    // Preload konten berikutnya
                    setTimeout(() => {
                        preloadFrame.src = SHEET_URL + '&t=' + new Date().getTime();
                    }, 2000);
                    
                    // Mulai interval refresh
                    startRefreshInterval();
                });
                
                // Error handling first load
                displayFrame.addEventListener('error', function() {
                    console.error('First load failed, retrying...');
                    setTimeout(() => {
                        displayFrame.src = SHEET_URL + '&t=' + new Date().getTime();
                    }, 3000);
                });
                
                // Timeout first load
                setTimeout(() => {
                    if (isFirstLoad) {
                        console.warn('First load timeout, retrying...');
                        displayFrame.src = SHEET_URL + '&t=' + new Date().getTime();
                    }
                }, 25000);
            }
            
            // Start refresh interval
            function startRefreshInterval() {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
                
                refreshInterval = setInterval(() => {
                    if (!document.hidden && !isUpdating) {
                        loadNextContent();
                    }
                }, 20000); // 20 detik
                
                console.log('Refresh interval started: 20 seconds');
            }
            
            // Handle visibility change
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (refreshInterval) {
                        clearInterval(refreshInterval);
                        refreshInterval = null;
                    }
                    statusBar.textContent = '⏸️ Paused';
                } else {
                    statusBar.textContent = '▶️ Resuming...';
                    if (!refreshInterval) {
                        startRefreshInterval();
                        // Refresh jika sudah lama
                        const now = Date.now();
                        if (displayFrame.src && displayFrame.src.includes('&t=')) {
                            const timestamp = parseInt(displayFrame.src.split('&t=')[1]);
                            if (now - timestamp > 30000 && !isUpdating) {
                                loadNextContent();
                            }
                        }
                    }
                }
            });
            
            // Handle error global
            window.addEventListener('error', function(e) {
                console.error('Global error:', e.message);
            });
            
            // Mulai
            initialize();
            
            console.log('Dashboard initialized with advanced anti-blink technique');
            
        })();
    </script>

</body>
</html>
