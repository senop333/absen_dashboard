<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Google Sheets - Tanpa Iframe</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        
        #dashboard-container {
            width: 100vw;
            height: 100vh;
            background: white;
            overflow: hidden;
            position: relative;
        }
        
        /* Loading overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }
        
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            color: #666;
            font-size: 16px;
        }
        
        /* Container untuk konten */
        #content-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            padding: 20px;
            background: white;
        }
        
        /* Style tabel */
        #data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: white;
        }
        
        #data-table th {
            background: #1a73e8;
            color: white;
            padding: 12px 15px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }
        
        #data-table td {
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        #data-table tr:hover {
            background: #f5f5f5;
        }
        
        #data-table tr:nth-child(even) {
            background: #fafafa;
        }
        
        #data-table tr:nth-child(even):hover {
            background: #f0f0f0;
        }
        
        /* Status bar */
        #status-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            font-family: monospace;
            pointer-events: none;
        }
        
        /* Error message */
        #error-message {
            display: none;
            padding: 20px;
            text-align: center;
            color: #d32f2f;
            font-size: 16px;
            background: #ffebee;
            border-radius: 8px;
            margin: 20px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            #data-table {
                font-size: 12px;
            }
            #data-table th, #data-table td {
                padding: 8px 10px;
            }
            #content-container {
                padding: 10px;
            }
        }
        
        /* Scrollbar styling */
        #content-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        #content-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        #content-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        #content-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Data dari Google Sheets...</div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">⏳ Memuat...</div>

    <!-- Dashboard Container -->
    <div id="dashboard-container">
        <div id="content-container">
            <div id="error-message"></div>
            <table id="data-table">
                <thead>
                    <tr id="table-header">
                        <!-- Header akan diisi oleh JavaScript -->
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Data akan diisi oleh JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // Konfigurasi=========================================================================================================================================================
            const SHEET_ID = '1V5RVO8PvYiFrl-50ahomXDc8vvnzMirjI4-QNrD1W9k';
            const SHEET_NAME = 'Dashboard'; // Ganti dengan nama sheet Anda
            const API_KEY = ''; // Kosongkan jika publik
            
            // Alternatif: Gunakan URL publik CSV
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQrR_4sYU9WDCp382UliBFElOjQ_lvMkvZQl9tkzRmrNmdYT3ZDSRPoXV3Qm8d12eZ46prmGhVFuym4/pub?gid=1962305559&single=true&output=csv';
            
            // DOM Elements
            const tableHeader = document.getElementById('table-header');
            const tableBody = document.getElementById('table-body');
            const statusBar = document.getElementById('status-bar');
            const loadingOverlay = document.getElementById('loading-overlay');
            const errorMessage = document.getElementById('error-message');
            
            let refreshInterval = null;
            let isUpdating = false;
            let currentData = null;
            
            // Fungsi untuk fetch data dari Google Sheets sebagai CSV
            async function fetchSheetData() {
                try {
                    const url = CSV_URL + '&t=' + new Date().getTime();
                    console.log('Fetching data from:', url);
                    
                    const response = await fetch(url, {
                        cache: 'no-store',
                        headers: {
                            'Cache-Control': 'no-cache',
                            'Pragma': 'no-cache'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const csvText = await response.text();
                    return parseCSV(csvText);
                    
                } catch (error) {
                    console.error('Error fetching data:', error);
                    throw error;
                }
            }
            
            // Parse CSV ke array 2D
            function parseCSV(csvText) {
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                if (lines.length === 0) return [];
                
                return lines.map(line => {
                    // Handle CSV dengan kutip
                    const values = [];
                    let current = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            values.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current.trim());
                    return values;
                });
            }
            
            // Render data ke tabel
            function renderData(data) {
                if (!data || data.length === 0) {
                    showError('Tidak ada data yang ditemukan');
                    return;
                }
                
                // Header
                const headerRow = data[0];
                tableHeader.innerHTML = headerRow.map(col => 
                    `<th>${escapeHTML(col)}</th>`
                ).join('');
                
                // Body
                const bodyRows = data.slice(1);
                if (bodyRows.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="100" style="text-align:center;padding:40px;color:#999;">Tidak ada data</td></tr>';
                    return;
                }
                
                tableBody.innerHTML = bodyRows.map(row => {
                    // Pastikan setiap row memiliki jumlah kolom yang sama dengan header
                    const rowData = [...row];
                    while (rowData.length < headerRow.length) {
                        rowData.push('');
                    }
                    return `<tr>${rowData.map(cell => `<td>${escapeHTML(cell)}</td>`).join('')}</tr>`;
                }).join('');
                
                // Update status
                const rowCount = bodyRows.length;
                const colCount = headerRow.length;
                statusBar.textContent = `✅ ${rowCount} baris × ${colCount} kolom • ${new Date().toLocaleTimeString()}`;
                
                // Sembunyikan loading
                loadingOverlay.classList.add('hidden');
                errorMessage.style.display = 'none';
            }
            
            // Escape HTML untuk keamanan
            function escapeHTML(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            // Tampilkan error
            function showError(msg) {
                errorMessage.textContent = '❌ ' + msg;
                errorMessage.style.display = 'block';
                loadingOverlay.classList.add('hidden');
                statusBar.textContent = '❌ Error: ' + msg;
            }
            
            // Refresh data
            async function refreshData() {
                if (isUpdating) {
                    console.log('Update already in progress, skipping...');
                    return;
                }
                
                isUpdating = true;
                statusBar.textContent = '⏳ Memuat ulang...';
                
                try {
                    const data = await fetchSheetData();
                    if (data && data.length > 0) {
                        renderData(data);
                        currentData = data;
                    } else {
                        throw new Error('Data kosong');
                    }
                } catch (error) {
                    console.error('Refresh failed:', error);
                    showError('Gagal memuat data: ' + error.message);
                    
                    // Jika masih ada data lama, tetap tampilkan
                    if (currentData) {
                        // Tapi jangan render ulang, hanya tampilkan status error
                        statusBar.textContent = '⚠️ Gagal refresh • ' + new Date().toLocaleTimeString();
                    }
                } finally {
                    isUpdating = false;
                }
            }
            
            // Mulai interval refresh
            function startRefreshInterval() {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
                
                // Refresh setiap 30 detik (lebih aman untuk Google Sheets)
                refreshInterval = setInterval(() => {
                    if (!document.hidden) {
                        refreshData();
                    }
                }, 30000); // 30 detik
                
                console.log('Refresh interval started: 30 seconds');
            }
            
            // Inisialisasi
            async function initialize() {
                console.log('Initializing dashboard...');
                
                try {
                    // Load data pertama
                    const data = await fetchSheetData();
                    if (data && data.length > 0) {
                        renderData(data);
                        currentData = data;
                        startRefreshInterval();
                    } else {
                        throw new Error('Tidak ada data');
                    }
                } catch (error) {
                    console.error('Initialization failed:', error);
                    showError('Gagal memuat data: ' + error.message);
                    
                    // Coba lagi setelah 5 detik
                    setTimeout(() => {
                        initialize();
                    }, 5000);
                }
            }
            
            // Handle visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (refreshInterval) {
                        clearInterval(refreshInterval);
                        refreshInterval = null;
                    }
                    statusBar.textContent = '⏸️ Paused';
                } else {
                    statusBar.textContent = '▶️ Resuming...';
                    if (!refreshInterval) {
                        startRefreshInterval();
                        // Refresh segera jika sudah lama
                        refreshData();
                    }
                }
            });
            
            // Handle error
            window.addEventListener('error', (e) => {
                console.error('Global error:', e.message);
            });
            
            // Mulai aplikasi
            initialize();
            
            console.log('Dashboard initialized with Google Sheets API (CSV method)');
            
        })();
    </script>

</body>
</html>
